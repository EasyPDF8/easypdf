{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Complete | EasyPDF</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        .nav-btn {
            text-decoration: none;
            color: black;
            transition: 0.2s;
        }

        .nav-btn:hover {
            color: var(--accent);
        }

        .result-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .result-card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: clamp(2rem, 4vw, 3rem);
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* Animated Circle Container - Bigger */
        .success-animation {
            margin: 0 auto 1.5rem;
            width: 120px;
            height: 120px;
            position: relative;
        }

        /* Rotating Circle */
        .circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #E34234;
            position: absolute;
            top: 0;
            left: 0;
            animation: rotateCircle 0.6s ease-out forwards;
        }

        @keyframes rotateCircle {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(180deg);
                opacity: 0.8;
            }
            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        /* Tick Mark - Thinner and Bigger */
        .tick {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
        }

        .tick svg {
            width: 100%;
            height: 100%;
        }

        .tick svg polyline {
            fill: none;
            stroke: #E34234;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawTick 0.5s ease-out 0.5s forwards;
        }

        @keyframes drawTick {
            0% {
                stroke-dashoffset: 100;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }

        .result-title {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 0.8s forwards;
        }

        .result-text {
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 1s forwards;
        }

        .page-count {
            background: #f5f5f5;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 1.1s forwards;
        }

        .page-count span {
            font-weight: 800;
            color: #E34234;
        }

        .download-btn {
            display: block;
            background: #E34234;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 1.2s forwards;
        }

        .download-btn:hover {
            background: #C0362C;
            transform: translateY(-2px);
        }

        .back-link {
            margin-top: 1.5rem;
            display: inline-block;
            font-size: 0.85rem;
            text-decoration: none;
            color: #666;
            transition: 0.2s;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 1.3s forwards;
        }

        .back-link:hover {
            color: #E34234;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .success-animation {
                width: 100px;
                height: 100px;
            }
            
            .circle {
                width: 100px;
                height: 100px;
            }
            
            .tick {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

<body>

{% include 'includes/nav_inner.html' %}

<main class="result-wrapper">
    <div class="result-card">
        <!-- Animated Circle with Tick -->
        <div class="success-animation">
            <div class="circle"></div>
            <div class="tick">
                <svg viewBox="0 0 24 24">
                    <polyline points="5 13 10 18 19 7" />
                </svg>
            </div>
        </div>

        <h2 class="result-title">Merge Complete</h2>

        <p class="result-text">
            Your PDF files have been successfully merged
        </p>

        {% if page_count %}
        <div class="page-count">
            Total pages: <span>{{ page_count }}</span>
        </div>
        {% endif %}

        <a href="{% url 'download_file' filename %}" class="download-btn">
            Download PDF
        </a>

        <a href="{% url 'merge_pdf' %}" class="back-link">
            Merge more files
        </a>
    </div>
</main>

</body>
</html>
